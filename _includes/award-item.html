<li data-edit-item="{{ include.key }}">
  <span class="award-name"><span data-edit="{{ include.key }}.name" data-placeholder="Award name">{{ include.award.name }}</span><span class="award-detail" data-edit="{{ include.key }}.detail" data-placeholder="Detail, e.g. $2,000">{{ include.award.detail }}</span></span>
  <span class="award-year" data-edit="{{ include.key }}.year" data-placeholder="Year">{{ include.award.year }}</span>
</li>
