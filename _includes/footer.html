{%- comment -%} Footer. The time is when GitHub Pages last rebuilt the site, which happens after every change. {%- endcomment -%}
<footer class="foot">
  <p>{{ site.data.profile.name }}, {{ site.data.profile.location }}. Updated <time datetime="{{ site.time | date_to_xmlschema }}">{{ site.time | date: "%B %-d, %Y at %H:%M UTC" }}</time>.</p>
  <p><a href="{{ include.back_url }}">{{ include.back_label }}</a><a class="foot-edit" href="?edit">Edit</a></p>
</footer>
